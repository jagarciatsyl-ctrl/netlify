# Ficha del proyecto para Dorothy (plan sección 13). `scripts/piloto publicar` rellena el repo y el sitio.
clave: PILOTO
nombre: Piloto · lista de tareas
repo: "jagarciatsyl-ctrl/netlify"
forja: github
rama_integracion: main
stack:
  tipo: html-js-estatico
  tests_aceptacion: [pytest-bdd, playwright-python]
revision_externa: ninguna
conjunto_protegido:            # solo Espantapájaros puede modificarlo
  - "tests/aceptacion/**"
  - "pytest.ini"
rutas_triviales:               # un diff que toque solo esto puede ir por el workflow trivial
  - "docs/**"
  - "*.md"
preview:
  proveedor: netlify
  sitio: "dorothy-piloto"
  alias: "pr-{n}"
presupuestos:
  tarea: { coste_usd: 10, invocaciones: 30 }
