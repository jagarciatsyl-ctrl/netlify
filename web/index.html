<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tareas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Tareas</h1>
    <form id="nueva">
      <label for="titulo">Nueva tarea</label>
      <input id="titulo" name="titulo" required autocomplete="off">
      <button type="submit">Añadir</button>
    </form>
    <p id="contador-pendientes" aria-live="polite"></p>
    <ul id="lista" aria-label="Lista de tareas"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
